---
layout: default
---
<div class="wrapper wrapper--narrow">
  <article class="page">
    {%- unless page.hide_title -%}
    <header class="page-header">
      <h1 class="page-header__title">{{ page.title | escape }}</h1>
      {%- if page.lede -%}<p class="page-header__lede">{{ page.lede }}</p>{%- endif -%}
    </header>
    {%- endunless -%}

    <div class="prose">
      {{ content }}
    </div>
  </article>
</div>
